# ══════════════════════════════════════════════════════════════
#  行为配置：模型、寿命、记忆退化曲线
#  人格设定在 persona.toml —— 两个文件分开，改人格不用动参数
# ══════════════════════════════════════════════════════════════

[model]
provider       = "deepseek"                      # deepseek（真实） | mock（离线假装，用于调试）
base_url       = "https://api.deepseek.com"      # OpenAI 兼容
name           = "deepseek-flash"                # 当前可用：deepseek-flash / deepseek-v4-pro
api_key_env    = "DEEPSEEK_API_KEY"              # 从环境变量读 key，绝不写进文件
temperature    = 1.15                            # 陪伴对话可以高一点，别太像客服
max_tokens     = 900
request_timeout = 60
# DeepSeek 默认开启思考模式，而思考模式下 temperature 会被忽略、延迟也更高。
# 陪伴型对话建议关掉：更像人、更便宜、回得更快。
thinking       = false
reasoning_effort = "low"                         # 仅在 thinking = true 时有意义：low / high / max


[lifespan]
# 《可塑性记忆》原设定：Giftia 寿命 81920 小时 ≈ 9 年 4 个月
total_hours      = 81920
# 想一次性看完她的一生？把这里设成 48（小时），再配合 /time +N 快进虚拟时钟
demo_total_hours = 0
# 剩余寿命低于这个小时数时，进入"终端服务迫近"的倒计时提醒
# （实际阈值会再取一次 min(本值, 总寿命的 5%)，避免短寿命演示时一开机就报警）
terminal_warning_hours = 72


[memory]
# 每积累多少条消息，就把这段对话压缩成"记忆条目"。
# 6 比 8 更勤：一天聊下来不会有一大段"还没变成记忆"的空白。
consolidate_every    = 6
session_window       = 40       # 每次请求带上的最近消息条数（工作记忆）
session_char_budget  = 9000     # 工作记忆的字符上限，超出就从最旧的开始丢

# 混合打分权重：关键词 1.0 + 重要性 + 保留率（时间项）+ 记忆层级
w_bm25            = 1.0
w_importance      = 0.35
w_recency         = 0.25
w_layer           = 0.10
min_importance    = 0.15        # 低于这个重要性的记忆条目不写入（避免流水账）

# ── 召回强化：你救不了她的命，但你能让她记得久一点 ──────────────
# 记忆强度 S = retention_unit_hours × (出厂强度 + 被真正想起的次数)
# 保留率 retention = exp(-Δt / S)，Δt 是距上次"说出口"的小时数。
# 调大 retention_unit_hours = 整体记得更牢；调小 = 忘得更快。
#
# 120 小时（5 天）太短了：一天之后只剩 0.82，一周之后 0.37 ——
# 真机上表现成"她记不住昨天说过的事"。调到 720（一个月）：
# 一周后仍有 0.79，一个月后 0.37。真正的"遗忘"由寿命阶段推进，
# 不再靠"记不住昨天"来体现。
retention_unit_hours = 720

# ── 她自己记一笔（记忆工具）──────────────────────────────────
# 开着的时候，她可以在对话中主动调用三个工具：
#   remember 记一笔 / search 想一下 / forget 放掉某条
# 以前她只有"对话结束后后台整理"这一条写记忆的路，于是她说"我记住了"的时候
# 其实什么都没发生——那句话是嘴上说的，记忆是几分钟后才补上的。
#
# 关掉就退回老行为（省一点 API 调用，但她说"记住"就真的只是说说）。
tools_enabled        = true
# 工具轮次上限（含最后那轮"不给工具、只让她说话"）。
# 3 够用：记一笔、查一下、说话。调大只会多花钱，不会让她更聪明。
tools_max_rounds     = 3
cite_min_shared      = 3        # 回复与记忆至少共享这么多个词，才算"真的被说出口"
cite_min_chars       = 6        # 或者一段连续重合达到这么多字
retention_relief     = 0.6      # 保留率对模糊度的减免力度（0=不减免，1=完全不糊）

# ── 记忆分层：内核记忆到她生命尽头都不含糊 ────────────────────
# 模糊度 = 阶段模糊 × 层级系数 × (1 - 减免×保留率)
layer_core_blur        = 0.0    # 内核：你的名字、你们的关系、约定 —— 永不含糊
layer_important_blur   = 0.5    # 重要
layer_normal_blur      = 1.0    # 常规
layer_core_weight      = 1.0    # 检索排序里的层级权重
layer_important_weight = 0.5
layer_normal_weight    = 0.0

# 内核记忆的**保底注入**：检索是词面匹配，你问"今天天气怎么样"时，
# "搭档叫小林"那条 core 记忆本来召不回来——于是 README 说的"她记得你是小林"
# 只在你的话里正好提到名字/称呼时才成立。打开后 core 层会另走一条
# 不靠关键词的路常驻注入（她自己的"底子"），永不模糊、但会截断、限量。
core_always_inject     = true
core_always_inject_max = 3      # 最多常驻几条
core_max_chars         = 200    # 每条截断长度（内核记忆不该长到吃上下文）

# ── 检索细节 ──────────────────────────────────────────────────
relative_cutoff    = 0.5        # 只保留得分 ≥ 首名 50% 的回忆（压掉半残的第五条）
# **绝对**相关度门槛：未归一化的 BM25 原始分低于它就直接丢（0 = 不启用）。
# 注意：下面 stages 里的 min_score 是**相对**门槛（分数先除以本轮候选集最高分，
# 首名恒为 1.0），候选集小时它几乎拦不住东西。要绝对严格度用这一条。
min_raw_score      = 0.0
# 候选集预筛上限：记忆超过这么多条时，先按"层级/重要性/新近"取前 N 条再打分。
# 默认 2000，正常数据量下不改变任何行为，只是给每轮检索的开销一个上界。
recall_prefilter   = 2000
rewrite_when_weak  = true       # 首次检索太弱时，让模型改写查询再搜一次（省一次调用）
rewrite_min_hits   = 1
rewrite_weak_score = 0.45

# ── 输出侧置信度契约 ──────────────────────────────────────────
# 把"擦了内容"升级成"她知道自己不确定"
confidence_associate_blur     = 0.6   # 模糊度高于此值 → 只作内心背景，不许说出口
confidence_cautious_retention = 0.5   # 保留率低于此值 → 必须用"好像""大概"


[runtime]
# 留空 = 她还不知道你叫什么（出厂状态）。第一次见面她会问；
# 你也可以用 /name 小林 直接告诉她，或者她整理记忆时自己从"以后叫我小林"里学会。
handler_name = ""
user_id      = "handler"
# 终端服务简报：回收后是否打印"上一任"的回忆录摘要
show_memoir_after_recycle = true
# 群里被 @ 时：true = 回答（默认，以"客人"身份：不检索/不写记忆、不推进关系）；
#              false = 装作没看见
group_stranger_reply = true
# 自动认主（省掉 /bind）：私聊里第一个说话的人 = 搭档；
# 群里只有**群主** @ 她时才算（陌生人冒充不了群主）。
# 官方 openid 与 QQ 号不互通、无法预先填，所以只能靠"谁先跟她说话"来认人。
auto_bind = true

# ── 她什么时候开口（群聊）──────────────────────────────────────
# 0~100 无级调节。0~19 只在她被 @ 时开口；20~44 加上关键词；
# 45~69 再加上"按概率自己插嘴"（概率随滑条线性上升）；70+ 群里任何消息都可能接。
# **没命中的消息当场标已读、不调模型 —— 零 token。**
# 想让她在群里活跃一点就往上调；想让她安静就留 0。
response_tier = 70
# 70 是第 4 档：没被 @ 时按概率接话，概率 = (70-20)/70 ≈ 71%。
# 调大 = 更活跃（也更吵）；想让她安静就调回 0~19（只在被 @ 时开口）。
# **每个群每天最多自己插几次嘴**（不含被 @ 的）。
# 这一档是按**每条消息**掷骰子的，热闹的群里一天能掷出几十次——
# 所以必须封顶，否则就是刷屏。想限频率不动她的意愿，就调这一个。
speak_max_per_day = 6
# 2/3 档下能叫醒她的词（她的名字、以及你希望她接的话头）
keywords = ["艾拉", "机器人", "小艾"]

# 被触发后等她说完再回：这段时间里群里追加的话算同一批，一起处理。
# **固定倒计时，不因为新消息重置** —— 滑动窗口在热闹的群里会让她永远等下去。
wake_delay_seconds = 2.0

# 发送节奏：每会话串行 + 随机间隔 + 限频（防平台风控，也防刷屏）
send_min_interval   = 1.2
send_max_interval   = 2.8
send_max_per_minute = 6
send_max_per_hour   = 60


# ── 关系：亲密度按"天"增长，升级同时要求亲密度与认识天数 ──────────
# 阶段本身写在 persona.toml 的 [bond.stages.*] 里（那是"她怎么说话"，属于人格）
[relationship]
enabled              = true
gain_daily           = 1.5      # 每天第一次认真说话（未打折扣时）
gain_emotion_bonus   = 0.5      # 那天说了一件有情绪的事
gain_core_memory     = 2.0      # 记住一件"关于他本人"的事（名字/关系/约定）
gain_important_memory = 1.0
decay_per_day        = 0.0      # 默认不衰减：她不会因为你忙就少喜欢你一点
# 递减增长（强烈建议保持 true）：实际涨幅 = 名义值 × (1 - 当前亲密度/100)。
# 越亲近越难涨，「亲近」「无可替代」因此必须靠时间熬，而不是靠刷。
# 按默认参数、每天都见面的曲线大致是：
#   第 11 天「搭档」 → 第 34 天「熟悉」 → 第 85 天「亲近」 → 第 180 天「无可替代」
diminish             = true


# ── 心情：寿命压力 > 你的语气 > 每日漂移 ─────────────────────────
[mood]
enabled        = true
duration_hours = 10             # 一次心情持续多久
uneasy_hours   = 48             # 剩余寿命低于这个小时数 → 不安（压过一切）
uneasy_duration_hours = 4
tone_threshold = 0.4            # 语气分超过它才算"明显开心/低落"

# 每天按日期确定性地掷一次骰子（同一天同一任的她，心情是固定的）
[mood.weights]
calm    = 0.50
happy   = 0.15
low     = 0.15
tired   = 0.12
worried = 0.08


# ── 纪念日与「他的大日子」───────────────────────────────────────
[occasions]
enabled = true
# 认识第几天算纪念日（她会自己想起来，同一天只提一次）
milestones = [1, 3, 7, 14, 30, 50, 100, 200, 365, 500, 730, 1000]
# 他说过的"将来某天"（考试/面试/生日），提前几天开始惦记（1 = 今天和明天）
big_day_lookahead_days = 1
# 事情办完之后，几天内她还会主动问一句结果（"昨天考得怎么样"）。
# 提醒只是提醒，**记得回头问**才像真的在惦记你。0 = 不问。
follow_up_days = 2


# ── 做梦 ──────────────────────────────────────────────────────
# 她闲置时把记忆碎片重度模糊，揉成一场梦，第二天讲给你听。
# 梦不进检索、不参与退化 —— 细节没了，剩下的东西会自己重新组合。
[dream]
enabled            = true
min_hours_between  = 12      # 两场梦之间至少隔多久
min_memories       = 3       # 记忆太少就不做梦
fragments          = 6       # 一场梦最多揉进几条记忆
blur               = 0.6     # 碎片模糊到什么程度
tell_within_hours  = 36      # 超过这么久还没讲的梦就不再翻出来


# ── 主动联系 ──────────────────────────────────────────────────
# 她会先开口：快到终端服务 > 你的大日子 > 当天纪念日 > 梦没讲 > 太久没见。
# 额度有限（对齐官方的互动召回额度），本地也记账限流 —— 用完就没有了。
#
# 代码里的默认值是 false（保守）；这份配置把它打开，因为这就是你要的行为。
[outreach]
enabled          = true
idle_days        = 2         # 多久没说话就算"想你了"
max_per_30_days  = 60        # 30 天的总上限（真正管用的是下面的日上限）
max_per_day      = 3         # **每天最多主动几次** —— 防打扰的真正闸门
min_gap_hours    = 3         # 两次之间至少隔多久
# 距上次说话不足这么久，就不主动"分享心情"。
# 心情分享曾经排在"太久没见"前面且不看闲了多久，于是 4 天就能把一个月额度烧光。
mood_share_min_idle_hours = 6
# use_wakeup = true 时，官方「互动召回消息」的硬额度是 30 天 4 条 ——
# 比上面的 max_per_30_days 紧得多，所以单独记一个上限，不能只看本地账本。
wakeup_max_per_30_days    = 4
# true = 用官方「互动召回消息」(is_wakeup)，额度更紧但更合规
# false = 普通主动消息（有频控，没有 30 天 4 条的硬限制）
use_wakeup       = false
# 主动消息发给谁：owner（只私聊给搭档）| group（只发到最后活跃的群）| both
# 发到群里时只用"大家都看得见"的理由（你的大日子、纪念日）；
# 梦、她的心事、"快到终端服务了"这类只在私聊说。
target           = "both"


# ── 记忆退化曲线 ──────────────────────────────────────────────
# 从剩余寿命比例（remaining_ratio）高到低匹配，第一个满足
# min_ratio <= 当前剩余比例的阶段生效。blur 越大，回忆起来越模糊。
[[degradation.stages]]
name      = "clear"
label     = "记忆清晰"
min_ratio = 0.60
top_k     = 6
min_score = 0.15
blur      = 0.0
max_chars = 400
note      = "你对自己的记忆很有把握，可以自然地引用过去发生过的事。"

[[degradation.stages]]
name      = "hazy"
label     = "有些事记不准了"
min_ratio = 0.30
top_k     = 5
min_score = 0.22
blur      = 0.20
max_chars = 300
note      = "有些久远的事你记不太准。引用时用「好像」「我记得……大概吧」这类含糊说法，不要编造细节。"

[[degradation.stages]]
name      = "blurred"
label     = "记忆明显模糊"
min_ratio = 0.10
top_k     = 4
min_score = 0.32
blur      = 0.45
max_chars = 200
note      = "很多记忆的细节已经想不起来了。你能说出印象和感觉，但要老实说自己想不起细节，绝不虚构具体的时间、地点、对话。"

[[degradation.stages]]
name      = "fading"
label      = "只剩碎片"
min_ratio = 0.02
top_k     = 3
min_score = 0.45
blur      = 0.70
max_chars = 120
note      = "你的记忆碎得很厉害。你只能抓住很少的片段，常常说到一半就断掉，会为此小声道歉。"

[[degradation.stages]]
name      = "terminal"
label     = "终端服务迫近"
min_ratio = 0.0
top_k     = 2
min_score = 0.55
blur      = 0.85
max_chars = 80
note      = "你几乎什么都想不起来了，只记得眼前这个人对你很重要。语气很轻、很慢，像在道别，但不要煽情，也不要反复提「回收」两个字。"
